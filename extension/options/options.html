<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BiliWebAndroidStream 设置</title>
  <style>
    :root {
      color-scheme: light dark;
      --pink: #fb7299; --ink: #20212b; --muted: #737784; --line: #e8e9ed; --panel: #fff; --soft: #f7f8fa; --ok: #20a464; --warn: #d9822b;
      --page: #f4f5f7;
      --btn-bg: #fff; --btn-border: #d8dae0; --btn-hover-bg: #fff8fa; --btn-hover-fg: #d94d77;
      --pill-bg: #eceef2; --pill-ok-bg: #e6f7ee; --pill-warn-bg: #fff2df;
      --qr-bg: #fff8fa; --qr-border: #f0a3b8;
      --status-bg: #20212b; --status-fg: #f6f7fa; --status-err-bg: #7f2e3a; --status-ok-bg: #17633f;
      --shadow: 0 2px 8px rgba(34, 34, 34, .13);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e8e9ee; --muted: #9ba0ad; --line: #33363f; --panel: #1d1f26; --soft: #262933; --ok: #4ecb8d; --warn: #eda352;
        --page: #14151a;
        --btn-bg: #262933; --btn-border: #3d414d; --btn-hover-bg: #33262b; --btn-hover-fg: #fb7299;
        --pill-bg: #2d3039; --pill-ok-bg: #17352a; --pill-warn-bg: #382a18;
        --qr-bg: #262933; --qr-border: #a3546c;
        --status-bg: #101116; --status-fg: #e8e9ee; --status-err-bg: #55232b; --status-ok-bg: #123c29;
        --shadow: 0 2px 8px rgba(0, 0, 0, .45);
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 640px; background: var(--page); color: var(--ink); font: 14px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 900px; margin: 0 auto; padding: 36px 28px 52px; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
    h1 { margin: 0; font-size: 28px; letter-spacing: -.02em; } h2 { margin: 0; font-size: 17px; }
    header p { margin: 5px 0 0; color: var(--muted); } .version { color: var(--muted); font-size: 12px; }
    .card { margin: 14px 0; padding: 20px 22px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
    .card-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 15px; }
    .card-head p { margin: 3px 0 0; color: var(--muted); }
    .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .status-item { min-height: 74px; padding: 12px 14px; background: var(--soft); border: 1px solid var(--line); border-radius: 10px; }
    .status-item strong { display: block; margin-bottom: 3px; font-size: 13px; } .status-item span { color: var(--muted); font-size: 13px; }
    .pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 99px; background: var(--pill-bg); color: var(--muted); font-size: 12px; white-space: nowrap; }
    .pill.ok { background: var(--pill-ok-bg); color: var(--ok); } .pill.warn { background: var(--pill-warn-bg); color: var(--warn); }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 15px; }
    button { appearance: none; border: 1px solid var(--btn-border); border-radius: 8px; padding: 8px 12px; background: var(--btn-bg); color: var(--ink); cursor: pointer; font: inherit; }
    button:hover:not(:disabled) { border-color: var(--pink); color: var(--btn-hover-fg); background: var(--btn-hover-bg); }
    button.primary { border-color: var(--pink); background: var(--pink); color: white; } button.primary:hover:not(:disabled) { background: #e85f87; color: white; }
    button.danger { color: #bd3e4d; } button:disabled { cursor: wait; opacity: .56; }
    @media (prefers-color-scheme: dark) { button.danger { color: #e8788a; } }
    .separator { height: 1px; margin: 20px 0; background: var(--line); }
    .hint { margin: 12px 0 0; color: var(--muted); font-size: 12px; }
    #qr-box { margin-top: 16px; padding: 16px; border: 1px dashed var(--qr-border); border-radius: 10px; text-align: center; background: var(--qr-bg); }
    #qr-image { width: 260px; height: 260px; max-width: 100%; background: white; }
    #status { min-height: 42px; margin: 14px 0 0; padding: 11px 13px; border-radius: 9px; background: var(--status-bg); color: var(--status-fg); white-space: pre-wrap; }
    #status.error { background: var(--status-err-bg); } #status.success { background: var(--status-ok-bg); }
    @media (max-width: 720px) { body { min-width: 0; } main { padding: 22px 14px 38px; } header { display: block; } .version { display: block; margin-top: 8px; } .status-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <header><div><h1>BiliWebAndroidStream</h1><p>让浏览器网页播放器直接使用 Bilibili Android 播放链路。</p></div><span class="version">浏览器扩展 · v0.3.0</span></header>
    <section class="card">
      <div class="card-head"><div><h2>登录态</h2><p>登录态保存在扩展本地存储中，不会离开本机。</p></div><span id="account-badge" class="pill">检查中</span></div>
      <div class="status-grid">
        <div class="status-item"><strong>Android 播放态</strong><span id="account-status">正在检查……</span></div>
      </div>
      <div class="actions"><button id="qr-login" class="primary">Android QR 登录</button><button id="refresh-button">刷新 Android 登录态</button><button id="clear-token" class="danger">清除 Android 登录态</button></div>
      <div id="qr-box" hidden><img id="qr-image" alt="Bilibili Android QR 登录二维码"><p>请用哔哩哔哩手机客户端扫描并确认。</p><button id="qr-cancel">取消二维码登录</button></div>
    </section>
    <p id="status" aria-live="polite">正在初始化……</p>
  </main>
  <script src="options.js"></script>
</body>
</html>
